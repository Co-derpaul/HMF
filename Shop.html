<!-- HEADER -->
 <div>
  <button class="cart-btn" onclick="openCart()">
    🛒 Cart <span class="cart-count" id="cartCount">0</span>

<!-- SEARCH & FILTER -->
<div class="controls">
  <div class="search-wrap">
    <span class="s-icon">🔍</span>

<!-- RESULTS COUNT -->

<!-- PRODUCT GRID -->
<div class="shop-grid" id="shopGrid"></div>

<!-- CART OVERLAY -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

<!-- CART SIDEBAR -->
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h2>🛒 Your Cart</h2>
    <button class="close-cart" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">₦0.00</span>
    </div>
    <button class="checkout-btn" onclick="openCheckout()">Proceed to Checkout →</button>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>🌿 Place Your Order</h2>
      <button class="close-modal" onclick="closeCheckout()">✕</button>
    </div>
    <div class="modal-body">
      <!-- Order Form -->
      <div id="checkoutForm">
        <div class="order-summary" id="orderSummary"></div>
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="fname" placeholder="Paul"/>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lname" placeholder="Smith"/>
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="paul@example.com"/>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" placeholder="+234 800 000 0000"/>
        </div>
        <div class="form-group">
          <label>Delivery Address</label>
          <textarea id="address" rows="2" placeholder="House No, Street, City, State" style="resize: vertical;"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>State</label>
            <select id="state">
              <option value="">Select State</option>
              <option>Abuja (FCT)</option><option>Abia</option><option>Adamawa</option>
              <option>Akwa Ibom</option><option>Anambra</option><option>Bauchi</option>
              <option>Bayelsa</option><option>Benue</option><option>Borno</option>
              <option>Cross River</option><option>Delta</option><option>Ebonyi</option>
              <option>Edo</option><option>Ekiti</option><option>Enugu</option>
              <option>Gombe</option><option>Imo</option><option>Jigawa</option>
              <option>Kaduna</option><option>Kano</option><option>Katsina</option>
              <option>Kebbi</option><option>Kogi</option><option>Kwara</option>
              <option>Lagos</option><option>Nasarawa</option><option>Niger</option>
              <option>Ogun</option><option>Ondo</option><option>Osun</option>
              <option>Oyo</option><option>Plateau</option><option>Rivers</option>
              <option>Sokoto</option><option>Taraba</option><option>Yobe</option><option>Zamfara</option>
            </select>
          </div>
          <div class="form-group">
            <label>Payment Method</label>
            <select id="payment">
              <option>Bank Transfer</option>
              <option>Pay on Delivery</option>
              <option>Card Payment</option>
            </select>
          </div>
        </div>
        <button class="place-order-btn" onclick="placeOrder()">🌿 Place Order</button>
      </div>
      <!-- Success -->
      <div class="success-screen" id="successScreen">
        <div class="success-icon">✅</div>
        <h2>Order Placed!</h2>
        <p>Thank you! Your medicinal herbs are on the way.<br/>You'll receive a confirmation shortly.</p>
        <button class="continue-btn" onclick="resetOrder()">Continue Shopping</button>
      </div>
    </div>
  </div>
</div>



<!-- TOAST -->
<div class="toast" id="toast"></div>

const PRODUCTS = [

  // SKIN & DETOX
  { id:25, name:"Neem Leaf Powder",     emoji:"🌿", category:"Skin & Detox",  price:2300, desc:"Antibacterial herb for acne, eczema, and skin purification.", badge:null },
  { id:26, name:"Dandelion Root Tea",   emoji:"🌻", category:"Skin & Detox",  price:2700, desc:"Detoxifies liver, purifies blood, and clears skin conditions.", badge:null },
  { id:27, name:"Burdock Root",         emoji:"🌱", category:"Skin & Detox",  price:3400, desc:"Deep blood cleanser. Treats acne, psoriasis, and eczema.", badge:"Popular" },
  { id:28, name:"Milk Thistle Seeds",   emoji:"🌸", category:"Skin & Detox",  price:4100, desc:"Protects liver cells, aids detoxification, and improves skin clarity.", badge:null },
  // HEART HEALTH
  { id:29, name:"Hawthorn Berry",       emoji:"❤️", category:"Heart Health",  price:4600, desc:"Strengthens heart muscle, lowers blood pressure, improves circulation.", badge:null },
  { id:30, name:"Garlic Extract Caps",  emoji:"🧄", category:"Heart Health",  price:3000, desc:"Lowers cholesterol & blood pressure. Powerful cardiovascular protector.", badge:"Bestseller" },
];

const CATEGORIES = ["All", ...new Set(PRODUCTS.map(p => p.category))];
let cart = {};
let activeFilter = "All";

// ── CATEGORY COLORS ──
const catColors = {
  "Immunity":     "#e8f5e9",
  "Digestion":    "#fff3e0",
  "Stress & Sleep":"#f3e5f5",
  "Pain Relief":  "#fce4ec",
  "Blood Sugar":  "#e0f7fa",
  "Respiratory":  "#e8eaf6",
  "Skin & Detox": "#f9fbe7",
  "Heart Health": "#ffebee",
};

// ── BUILD FILTER BUTTONS ──
function buildFilters() {
  const wrap = document.getElementById("filterBtns");
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (cat === "All" ? " active" : "");
    btn.textContent = cat === "All" ? "🌿 All" : cat;
    btn.onclick = () => {
      activeFilter = cat;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      filterProducts();
    };
    wrap.appendChild(btn);
  });
}

// ── RENDER PRODUCTS ──
function filterProducts() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const filtered = PRODUCTS.filter(p => {
    const matchCat = activeFilter === "All" || p.category === activeFilter;
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  renderProducts(filtered);
  document.getElementById("resultsBar").textContent =
    `Showing ${filtered.length} of ${PRODUCTS.length} products`;
}

function renderProducts(list) {
  const grid = document.getElementById("shopGrid");
  grid.innerHTML = "";
  if (!list.length) {
    grid.innerHTML = `<div class="no-results"><div class="icon">🌿</div><p>No herbs found. Try a different search or category.</p></div>`;
    return;
  }
  list.forEach((p, i) => {
    const inCart = cart[p.id]?.qty > 0;
    const bgColor = catColors[p.category] || "#f5f5f5";
    const card = document.createElement("div");
    card.className = "product-card";
    card.style.animationDelay = `${i * 0.04}s`;
    card.innerHTML = `
      <div class="card-img" style="background:${bgColor}">
        <span>${p.emoji}</span>
        ${p.badge ? `<span class="card-badge">${p.badge}</span>` : ""}
      </div>
      <div class="card-body">
        <div class="card-category">${p.category}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-footer">
          <span class="card-price">₦${p.price.toLocaleString()}</span>
          <button class="add-btn ${inCart ? 'added' : ''}" id="btn-${p.id}" onclick="addToCart(${p.id})">
            ${inCart ? `✓ In Cart` : `+ Add`}
          </button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

// ── CART ──
function addToCart(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!cart[id]) cart[id] = { ...p, qty: 0 };
  cart[id].qty++;
  updateCartUI();
  const btn = document.getElementById(`btn-${id}`);
  if (btn) { btn.classList.add("added"); btn.textContent = "✓ In Cart"; }
  showToast(`${p.emoji} ${p.name} added to cart!`);
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  updateCartUI();
  renderCartItems();
  filterProducts();
}

function removeFromCart(id) {
  delete cart[id];
  updateCartUI();
  renderCartItems();
  filterProducts();
}

function updateCartUI() {
  const total = Object.values(cart).reduce((s, i) => s + i.qty, 0);
  document.getElementById("cartCount").textContent = total;
}

function renderCartItems() {
  const wrap = document.getElementById("cartItems");
  const items = Object.values(cart);
  if (!items.length) {
    wrap.innerHTML = `<div class="cart-empty">🌿<br/>Your cart is empty.<br/>Add some herbs to get started!</div>`;
    document.getElementById("cartTotal").textContent = "₦0.00";
    return;
  }
  wrap.innerHTML = items.map(item => `
    <div class="cart-item">
      <span class="ci-emoji">${item.emoji}</span>
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">₦${(item.price * item.qty).toLocaleString()}</div>
      </div>
      <div class="ci-controls">
        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
        <button class="remove-item" onclick="removeFromCart(${item.id})">🗑</button>
      </div>
    </div>`).join("");
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById("cartTotal").textContent = `₦${total.toLocaleString()}`;
}

function openCart() {
  renderCartItems();
  document.getElementById("cartOverlay").classList.add("open");
  document.getElementById("cartSidebar").classList.add("open");
}
function closeCart() {
  document.getElementById("cartOverlay").classList.remove("open");
  document.getElementById("cartSidebar").classList.remove("open");
}

// ── CHECKOUT ──
function openCheckout() {
  const items = Object.values(cart);
  if (!items.length) { showToast("Your cart is empty!"); return; }
  closeCart();
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);
  const rows = items.map(i =>
    `<div class="order-row"><span>${i.emoji} ${i.name} ×${i.qty}</span><span>₦${(i.price*i.qty).toLocaleString()}</span></div>`
  ).join("");
  document.getElementById("orderSummary").innerHTML =
    `<h3>Order Summary</h3>${rows}
     <div class="order-row"><span>Total</span><span>₦${total.toLocaleString()}</span></div>`;
  document.getElementById("checkoutForm").style.display = "block";
  document.getElementById("successScreen").classList.remove("show");
  document.getElementById("modalOverlay").classList.add("open");
}
function closeCheckout() {
  document.getElementById("modalOverlay").classList.remove("open");
}

function placeOrder() {
  const fname = document.getElementById("fname").value.trim();
  const lname = document.getElementById("lname").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();
  const state = document.getElementById("state").value;
  if (!fname || !lname || !email || !phone || !address || !state) {
    showToast("⚠️ Please fill all fields."); return;
  }
  document.getElementById("checkoutForm").style.display = "none";
  document.getElementById("successScreen").classList.add("show");
}

function resetOrder() {
  cart = {};
  updateCartUI();
  closeCheckout();
  filterProducts();
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

// ── INIT ──
buildFilters();
filterProducts();

        //------------------ toggle_nav --------------
 var menu_list = document.getElementById("menu_list")
    menu_list.style.maxHeight = "0px";
    function togglemenu() {
        if (menu_list.style.maxHeight == "0px") {
            menu_list.style.maxHeight = "100%"
        } else {
            menu_list.style.maxHeight = "0"
        }
    }
    </script>
